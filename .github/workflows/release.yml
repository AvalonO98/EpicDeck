name: Build and Release

on:
  # 方案 A:每次 push 到 main 自动构建 + 打包验证(不发布),作为 CI 健康检查
  # 打 v* tag 时:构建 + 打包 + 自动同步版本号 + 发布 Release
  push:
    branches:
      - main
    tags:
      - "v*"
  # 手动触发(可选)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Offline regression (backend + i18n + geometry)
        run: |
          python3 -m compileall -q main.py py_modules scripts
          python3 scripts/regression.py

      - name: Build frontend
        run: pnpm build

      - name: Package plugin zip (build check)
        # push 到 main 时:只验证打包是否成功,产物仅供检查,不发布
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python3 scripts/build_zip.py --skip-build

  release:
    # 只在打 v* tag 时执行发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync package.json version to tag
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import json, sys
          v = sys.argv[1]
          with open("package.json", encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = v
          with open("package.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print(f"package.json version synced to {v}")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Package plugin zip
        run: python3 scripts/build_zip.py --skip-build --version "${{ steps.version.outputs.version }}"

      - name: Extract release notes from CHANGELOG
        # Release 正文直接取 CHANGELOG 里对应版本的小节,避免用提交列表(对用户没有意义)。
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import pathlib, sys

          ver = sys.argv[1]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          body, grab = [], False
          for line in lines:
              if line.startswith("## ["):
                  grab = line.startswith(f"## [{ver}]")
                  continue
              if grab:
                  body.append(line)
          text = "\n".join(body).strip()
          if not text:
              text = f"变更说明见 [CHANGELOG.md](https://github.com/AvalonO98/EpicDeck/blob/main/CHANGELOG.md)。"
          pathlib.Path("release_notes.md").write_text(text + "\n", encoding="utf-8")
          print(f"release notes: {len(text)} chars")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "EpicDeck v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          # A tag like v0.9.3-beta.1 must not be served as /releases/latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            EpicDeck-v${{ steps.version.outputs.version }}.zip
